name: V20 NPC Builder candidate verification

on:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check syntax and regressions
        run: |
          set -eu
          for script in scripts/*.js; do node --check "$script"; done
          node tests/launcher-smoke.cjs
          node tests/manifest-smoke.cjs
          node tests/repair-mock.cjs
      - name: Verify candidate installable layout without publishing
        run: |
          set -eu
          zip -qr /tmp/v20-vampire-npc-builder.zip module.json scripts styles templates README.md LICENSE.md THIRD-PARTY-CONTENT.md RELEASE-NOTES.txt TEST-REPORT.md REPAIR-NOTES-v0.1.8.md docs tests CHANGELOG.md images
          unzip -tq /tmp/v20-vampire-npc-builder.zip
          unzip -Z1 /tmp/v20-vampire-npc-builder.zip | grep -qx 'module.json'
          unzip -Z1 /tmp/v20-vampire-npc-builder.zip | grep -qx 'scripts/pdf-lib.min.js'
          unzip -Z1 /tmp/v20-vampire-npc-builder.zip | grep -qx 'scripts/repair.js'
      - name: Retain complete candidate installer for test, not publication
        uses: actions/upload-artifact@v4
        with:
          name: v20-vampire-npc-builder-0.1.8-candidate
          path: /tmp/v20-vampire-npc-builder.zip
          retention-days: 14
